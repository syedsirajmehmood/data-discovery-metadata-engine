[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-plane-agent"
version = "0.1.0"
description = "Data-plane connector agent (Postgres + S3 MVP) for the hybrid data-discovery catalog"
requires-python = ">=3.9"
dependencies = [
    "psycopg2-binary>=2.9,<3",
    "boto3>=1.34,<2",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pyarrow>=14.0",
    "moto[s3]>=4.2",
]

[tool.setuptools]
packages = ["connectors", "connectors.core", "connectors.postgres", "connectors.s3", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires docker-compose services (postgres/minio) to be running",
]
