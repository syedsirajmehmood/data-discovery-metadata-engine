[project]
name = "control-plane"
version = "0.1.0"
description = "Control-plane backend: storage clients + catalog read API (FE2 slice) and ingest/fanout (FE1 slice, not in this file's scope)."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "neo4j>=5.14,<6.0",
    "opensearch-py>=2.4,<3.0",
    "clickhouse-connect>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "httpx>=0.26",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
