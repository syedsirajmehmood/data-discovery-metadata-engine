[pytest]
; See control-plane/README.md "Why pytest.ini lives at the repo root" for
; why this file exists and why it must live here rather than under
; control-plane/. Short version: architecture.md §1 fixes `control-plane/`
; (hyphenated) as a directory name, which Python cannot import as a dotted
; package (`import control-plane...` is a syntax error). This adds both
; the repo root (for `shared.schema`) and `control-plane/` itself (for
; `api.*` / `workers.*`) to sys.path, so ordinary absolute imports work
; without renaming any architecture.md-mandated directory.
pythonpath = . control-plane
testpaths = control-plane shared/schema/tests
python_files = test_*.py
